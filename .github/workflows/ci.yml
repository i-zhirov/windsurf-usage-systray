name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          cd windsurf-usage-systray
          xcodebuild test \
            -project WindsurfUsageSystray.xcodeproj \
            -scheme WindsurfUsageSystrayTests \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/windsurf-usage-systray-test-dd" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | grep -E "(Test Case|passed|failed|SUCCEEDED|FAILED)"
