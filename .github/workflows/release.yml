name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cd windsurf-usage-systray
          xcodebuild \
            -project WindsurfUsageSystray.xcodeproj \
            -scheme WindsurfUsageSystray \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package
        run: |
          cd windsurf-usage-systray
          ditto -c -k --keepParent \
            build/Build/Products/Release/WindsurfUsageSystray.app \
            WindsurfUsageSystray.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: windsurf-usage-systray/WindsurfUsageSystray.zip
          generate_release_notes: true

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#v}
          SHA=$(shasum -a 256 windsurf-usage-systray/WindsurfUsageSystray.zip | awk '{print $1}')

          FORMULA="cask \"windsurf-usage-systray\" do
            version \"$VERSION\"
            sha256 \"$SHA\"

            url \"https://github.com/i-zhirov/windsurf-usage-systray/releases/download/v#{version}/WindsurfUsageSystray.zip\"
            name \"Windsurf Usage Systray\"
            desc \"macOS menu bar app showing Windsurf quota in real time\"
            homepage \"https://github.com/i-zhirov/windsurf-usage-systray\"

            app \"WindsurfUsageSystray.app\"

            zap trash: [
              \"~/Library/Preferences/com.i-zhirov.windsurf-usage-systray.plist\",
              \"~/Library/Application Support/WindsurfUsageSystray\",
            ]
          end"

          ENCODED=$(echo "$FORMULA" | base64)

          # Get current file SHA (needed for update)
          CURRENT=$(curl -s \
            -H "Authorization: token $HOMEBREW_TAP_TOKEN" \
            https://api.github.com/repos/i-zhirov/homebrew-tap/contents/Casks/windsurf-usage-systray.rb)
          FILE_SHA=$(echo "$CURRENT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")

          curl -s -X PUT \
            -H "Authorization: token $HOMEBREW_TAP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/i-zhirov/homebrew-tap/contents/Casks/windsurf-usage-systray.rb \
            -d "{\"message\":\"Update windsurf-usage-systray to $VERSION\",\"content\":\"$ENCODED\",\"sha\":\"$FILE_SHA\"}"
