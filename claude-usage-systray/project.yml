name: WindsurfUsageSystray
options:
  bundleIdPrefix: com.i-zhirov
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: "$(ARCHS_STANDARD)"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: NO
    Release:
      ONLY_ACTIVE_ARCH: NO

targets:
  WindsurfUsageSystray:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Resources
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.i-zhirov.windsurf-usage-systray
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        LSUIElement: YES
    dependencies:
      - sdk: Security.framework
    entitlements:
      path: Resources/WindsurfUsageSystray.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true

  WindsurfUsageSystrayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        type: group
    dependencies:
      - target: WindsurfUsageSystray
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.i-zhirov.windsurf-usage-systray-tests
        GENERATE_INFOPLIST_FILE: YES
